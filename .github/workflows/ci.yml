name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install GNOME extension packaging tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gnome-shell
      - run: ./scripts/build.sh
